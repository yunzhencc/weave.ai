# The TanStack app lives at the workspace root; shadcn adds dependencies here.
ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true

# These exact versions are already pinned in the project's lockfile.
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - apps/*
  - packages/*

allowBuilds:
  '@openrouter/sdk': false
  esbuild: true
  lightningcss: true
  node-pty: true
  simple-git-hooks: true
  workerd: false
